name: probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q nba_api requests
      - name: probe
        run: |
          python - <<'PY'
          import time, requests
          from nba_api.stats.endpoints import leaguegamefinder, scheduleleaguev2
          H = {"User-Agent": "Mozilla/5.0", "Referer": "https://www.nba.com/", "Origin": "https://www.nba.com"}
          def note(name, f):
              t = time.time()
              try: msg = f"OK {f()}"
              except Exception as e: msg = f"FAIL {type(e).__name__}"
              print(f"::notice title={name}::{msg} ({time.time()-t:.1f}s)")
          note("gamefinder", lambda: leaguegamefinder.LeagueGameFinder(season_nullable="2026-27", league_id_nullable="00", timeout=20).get_data_frames()[0].shape)
          note("schedule-stats", lambda: scheduleleaguev2.ScheduleLeagueV2(season="2026-27", timeout=20).get_data_frames()[0].shape)
          note("cdn-schedule", lambda: len(requests.get("https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json", headers=H, timeout=20).json()["leagueSchedule"]["gameDates"]))
          note("cdn-boxscore", lambda: requests.get("https://cdn.nba.com/static/json/liveData/boxscore/boxscore_0022600010.json", headers=H, timeout=20).json()["game"]["homeTeam"]["teamTricode"])
          note("espn", lambda: requests.get("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/injuries", timeout=20).status_code)
          PY
