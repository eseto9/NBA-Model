name: Odds update
on:
  schedule:                    # ESPN's lines are free: hourly through the day, every 30 minutes
    - cron: "5 14-20 * * *"    # in the run-up to tipoffs (21:00-03:30 UTC = 5-11:30 PM EDT)
    - cron: "5,35 21-23 * * *"
    - cron: "5,35 0-3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - run: python odds.py
      - id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log/odds.csv site/data/odds.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Odds update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main && git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: odds
    if: needs.odds.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
