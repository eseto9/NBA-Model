name: Odds update
on:
  schedule:                    # free sources: hourly through the day, every 15 minutes from 5 PM to
    - cron: "5 14-20 * * *"    # midnight EDT (21:00-04:00 UTC), when injury reports and lines move
    - cron: "5,20,35,50 21-23 * * *"
    - cron: "5,20,35,50 0-3 * * *"
  workflow_dispatch:
  push:                        # also run whenever the odds or injury code changes
    branches: [main]
    paths: [".github/workflows/odds.yml", "odds.py", "injuries.py"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas pdfplumber
      - run: python odds.py
      - run: python injuries.py
      - id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log/odds.csv site/data/odds.json site/data/injuries.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Odds update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main && git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: odds
    if: needs.odds.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
