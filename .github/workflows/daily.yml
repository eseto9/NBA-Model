name: Daily update
on:
  schedule:
    - cron: "15 9 * * *"     # 5:15 AM EDT / 4:15 AM EST, after the night's last game
    - cron: "30 21 * * *"    # 5:30 PM EDT / 4:30 PM EST: re-price with the afternoon injury report
  workflow_dispatch:
  push:                      # also run once whenever this workflow changes
    branches: [main]
    paths: [".github/workflows/daily.yml"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish the next slate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python daily.py
  deploy:
    needs: update
    uses: ./.github/workflows/pages.yml
